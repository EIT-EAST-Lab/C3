# ===== Task: code (MBPP; runnable as shipped, extensible to multi-source mixing) =====
experiment_name: "c3_code"

environment:
  env_name: "CodeEnv"
  sampling_mode: merge_epoch
  reshuffle_each_epoch: true   # reshuffle at the start of every epoch; set false to keep a fixed order

  # Training: one or several sources; a single source is kept here.
  train_datasets:
    - name: "MBPP-train"
      path: "data/MBPP/train.jsonl"
      weight: 1.0
      limit: null

  # Evaluation: several suites are supported (run in order, metrics recorded per suite).
  eval_suites:
    - name: "MBPP-test"
      path: "data/MBPP/test.jsonl"
      limit: null
    - name: "MBPP+"     # when prepared
      path: "data/MBPP_PLUS/test.jsonl"
      limit: null

  episode_length: 1
  mix_seed: 42   # same deterministic mixing seed as the math task (no effect on a single source)

# Roles (Duo by default).
mas:
  roles_path: "../roles/code/roles_duo.json"
