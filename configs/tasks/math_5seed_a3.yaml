# ===== Task: math_5seed_a3 (the 5-seed run, 3-agent workflow: MATH-train only) =====
#
# The training task of the 3-agent 5-seed run (Table 8 of the paper): the data
# and evaluation suites of math_5seed.yaml, with the three-agent chain
# (Reasoner, Actor, Verifier) as the team.
#
# The numbers of Table 8 come from scripts/70_rebuild/final_eval.py after
# training, with configs/tasks/math_final_eval_a3.yaml.
experiment_name: "c3_math_5seed_a3"

environment:
  env_name: "MathEnv"
  sampling_mode: concat        # every problem appears once per epoch; merge_epoch oversamples the smaller source
  reshuffle_each_epoch: true   # reshuffle at the start of every epoch; set false to keep a fixed order

  # Training set: the MATH training split (Table 5, 5-seed run).
  train_datasets:
    - name: "MATH-train"
      path: "data/MATH/train.jsonl"
      weight: 1.0
      limit: null

  # Evaluation during training: the suites of math_5seed.yaml.
  eval_suites:
    - name: "MATH500"
      path: "data/MATH500/test.jsonl"
      limit: null
    - name: "CMATH-test"
      path: "data/CMATH/test.jsonl"
      limit: null
    - name: "GSM8K-test"
      path: "data/GSM8K/test.jsonl"
      limit: null

  # Environment and reward conventions: the same scorer as math.yaml.
  episode_length: 1
  math_backend: marft            # marft | simple
  reward_mode: vote_binary       # vote_binary | avg_per_answer
  use_math_verify: true
  mix_seed: 42                   # deterministic seed for the mixed sampling

# Roles (three-agent chain: reasoner -> actor -> verifier).
mas:
  roles_path: "../roles/math/roles_trio.json"
