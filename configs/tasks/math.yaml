# ===== Task: math (main experiment: MATH-train + CMATH-train) =====
experiment_name: "c3_math"

environment:
  env_name: "MathEnv"
  sampling_mode: concat        # every problem appears once per epoch; merge_epoch oversamples the smaller source
  reshuffle_each_epoch: true   # reshuffle at the start of every epoch; set false to keep a fixed order

  # Training set: mixed sampling over several sources.
  train_datasets:
    - name: "MATH-train"
      path: "data/MATH/train.jsonl"
      weight: 1.0
      limit: null
    - name: "CMATH-train"
      path: "data/CMATH/train.jsonl"
      weight: 1.0
      limit: null

  # Evaluation: the five main-table suites, which is what the evaluation that
  # runs during training measures. The two saturation controls (GSM8K-test,
  # CMATH-test) are reported once, after training, and live in
  # configs/tasks/math_final_eval.yaml with the rest of the final protocol.
  eval_suites:
    - name: "MATH500"
      path: "data/MATH500/test.jsonl"
      limit: null
    - name: "Minerva-Math"
      path: "data/MINERVA_MATH/test.jsonl"
      limit: null
    - name: "AMC23"
      path: "data/AMC23/test.jsonl"
      limit: null
    - name: "AIME24"
      path: "data/AIME24/test.jsonl"
      limit: null
    - name: "AIME25"
      path: "data/AIME25/test.jsonl"
      limit: null

  # Environment and reward conventions.
  episode_length: 1
  math_backend: marft            # marft | simple
  reward_mode: vote_binary       # vote_binary | avg_per_answer
  use_math_verify: true
  mix_seed: 42                   # deterministic seed for the mixed sampling

# Roles (Duo by default).
mas:
  roles_path: "../roles/math/roles_duo.json"
