- name: CMATH-train
  type: math
  output_path: data/CMATH/train.jsonl
  sha256: 7c7d16686241615bb930fd04dcc01ae0eef573140fd629bb4d350f0d84936c45
  expected_rows: 597
  source:
    kind: huggingface
    id: weitianwen/cmath
    config: default
    split: validation
    subtract_split: test
    revision: 6a626b7266f7c84fd2d2421ad695ffb34b8f9d69
    license: check HF card
    notes: Upstream ships no train split, so the training artifact is the validation
      split (600 problems) minus every problem whose statement also occurs in the
      test split of the same revision (3 problems), which leaves 597. Statements are
      compared after trimming and collapsing whitespace, never by id. The revision
      must be one that really has both splits.
- name: CMATH-test
  type: math
  output_path: data/CMATH/test.jsonl
  sha256: a696799a0f7e2a558cbf762eb9c1667c104f67b40b8e94e75f83a5562f9372c4
  expected_rows: 1098
  source:
    kind: huggingface
    id: weitianwen/cmath
    config: default
    split: test
    revision: 6a626b7266f7c84fd2d2421ad695ffb34b8f9d69
    license: check HF card
    notes: The real upstream test split, 1098 problems, used for evaluation only.
      The revision previously pinned here (9b140b4015a1c33b1f91fdb04400cefb9ea6db7e)
      had no test split at all, and the loader silently prepared the validation split
      under this name, so the CMATH evaluation file was a byte-for-byte copy of the
      CMATH training file. Both entries must stay on the same revision.
