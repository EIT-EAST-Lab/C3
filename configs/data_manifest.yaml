    config: default
    split: test
    revision: 83a7f387baaa524a8bda0022eac0541582297103
    license: check HF card
    notes: The 30 problems of AIME 2024, evaluation only. Upstream rows carry id,
      problem, solution and url and have no answer column at all; the answer is the
      content of the last \boxed{} of solution, and the builder fails loudly on a
      row where that extraction comes back empty rather than writing an unscorable
      row. Candidate benchmark for the start-accuracy probe.
