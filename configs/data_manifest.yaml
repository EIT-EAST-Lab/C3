outputs:
- name: MATH-train
  type: math
  output_path: data/MATH/train.jsonl
  sha256: null
  source:
    kind: huggingface
    id: EleutherAI/hendrycks_math
    configs:
    - algebra
    - counting_and_probability
    - geometry
    - intermediate_algebra
    - number_theory
    - prealgebra
    - precalculus
    split: train
    revision: PIN-ME
    license: check HF card
    notes: Canonical MATH training split. Upstream stores one config per subject,
      so the train split of the benchmark is the union of the seven subject train
      splits listed above. They are read in that order and concatenated, then
      deduplicated by unique_id when present and otherwise by the triple of input,
      answer and solution. Each row keeps level, subject (upstream calls it type)
      and solution. This replaces the mirror qwedsacf/competition_math, whose only
      split was named train but held 12500 rows, the MATH train and test sets
      together, and therefore contained every MATH500 problem.
