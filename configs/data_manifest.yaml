    config: default
    split: test
    revision: 563bb8404243c5f09de6ec262f2db674fe5bce9b
    license: check HF card
    notes: The 30 problems of AIME 2025, evaluation only. Upstream rows carry problem,
      answer and id, so the prepared row is problem to input and answer to answer,
