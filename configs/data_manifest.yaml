- name: Minerva-Math
  type: math
  output_path: data/MINERVA_MATH/test.jsonl
  sha256: b18ee6dfe00bce535f350b7e52d6edbc67f40d4b3f43b68d530fbfedd71f4474
  expected_rows: 272
  source:
    kind: huggingface
    id: math-ai/minervamath
    config: default
    split: test
    revision: ee46ddc498933b1977577953250ca5c66be64f96
    license: check HF card
    notes: Minerva Math (the OCWCourses and MATH subset used by the Minerva paper),
      evaluation only. Upstream rows carry exactly two string columns, question and
      answer, so the prepared row is question to input and answer to answer, with
      no solution, level or subject. Candidate benchmark for the start-accuracy probe;
      it is not used by any training or paper configuration yet.
- name: OlympiadBench
  type: math
  output_path: data/OLYMPIADBENCH/test.jsonl
  sha256: 49ad5b6388ccb9c640d0f69483fc04ced828db48689e8320fe3ef1fc2ae7562e
  source:
    kind: huggingface
    id: math-ai/olympiadbench
    config: default
    split: test
    multi_answer_policy: drop
    unit_policy: drop
    revision: 4faaf1e6ec17d11a4218a9bf4c049ecaf954dd84
    license: check HF card
    notes: The open-ended, text-only, English maths subset of OlympiadBench, which
      upstream calls OE_TO_maths_en_COMP, mirrored here under a real test split of
      674 rows. The answer column, final_answer, is a list of strings, and 93 of the
      674 rows hold more than one answer while 9 carry a separate unit string, so
      multi_answer_policy (drop, first or join_comma) and unit_policy (drop, ignore
      or append) decide what the single answer string of a prepared row is. Both are
      set to drop by the driver on 2026-09-15 (single-string scoring cannot take multi-answer
      or unit rows); the builder refuses to run while they are. No expected_rows is
      pinned because the row count follows from those two policies. Candidate benchmark
      for the start-accuracy probe.
- name: AMC23
  type: math
  output_path: data/AMC23/test.jsonl
  sha256: 5b501b1dd5a183f9911fdf20bf168fcca47f32ef30b3d25e7f3b2a91de558120
  expected_rows: 40
  source:
    kind: huggingface
    id: math-ai/amc23
    config: default
    split: test
    revision: 80815d37005feb82cd7f8fbc6901d5d3eff43057
    license: check HF card
    notes: The 40 short-answer problems of AMC 2023, evaluation only. Upstream rows
      carry id, question, answer and url, so the prepared row is question to input
      and answer to answer, with the upstream id kept as unique_id. Forty problems
      is too few for a tight interval on one pass, so the probe samples each problem
      several times. Candidate benchmark for the start-accuracy probe.
- name: AIME24
  type: math
  output_path: data/AIME24/test.jsonl
  sha256: a0a29b145782e1ffb8246cc8670ff2d34f2e76ee5c21c24300844c10d0f7b3b5
